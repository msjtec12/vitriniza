<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082227" />
      <stop offset="100%" stop-color="#0E3B43" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F49C6B" />
      <stop offset="100%" stop-color="#E36845" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner Crest Circle -->
  <circle cx="256" cy="256" r="165" fill="#14454E" stroke="#4FA6A6" stroke-width="8" filter="url(#shadow)" />

  <!-- Crown Icon Above M -->
  <path d="M 216 145 L 232 170 L 256 135 L 280 170 L 296 145 L 288 190 L 224 190 Z" fill="url(#goldGrad)" />
  <circle cx="216" cy="140" r="5" fill="#F49C6B" />
  <circle cx="256" cy="130" r="6" fill="#F49C6B" />
  <circle cx="296" cy="140" r="5" fill="#F49C6B" />

  <!-- Letter M -->
  <text x="256" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">M</text>

  <!-- Subtitle MASTER -->
  <rect x="176" y="325" width="160" height="34" rx="17" fill="#082227" stroke="#E36845" stroke-width="2" />
  <text x="256" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#F49C6B" text-anchor="middle" letter-spacing="4">MASTER</text>

  <!-- Stars / Accents -->
  <circle cx="160" cy="256" r="4" fill="#4FA6A6" />
  <circle cx="352" cy="256" r="4" fill="#4FA6A6" />
</svg>
